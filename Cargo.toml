[package]
name = "techy"
version = "0.1.0"
edition = "2021"
authors = ["Philippe Faist"]
description = "A fast, extensible LaTeX parser for Rust"
license = "MIT"
repository = "https://github.com/yourusername/techy"
keywords = ["latex", "parser", "tex"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
thiserror = "1.0"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[profile.release]
lto = true
codegen-units = 1
