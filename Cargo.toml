[package]
name = "techy"
version = "0.1.0"
edition = "2021"
# Dyn trait upcasting to `dyn Any` (diagnostics condition payloads, DESIGN_RATIONALE.md
# §3.8) stabilized in 1.86; core::error::Error, the previous pin, needed only 1.81.
rust-version = "1.86"
authors = ["Philippe Faist"]
description = "A fast, extensible LaTeX parser for Rust"
license = "MIT"
repository = "https://github.com/phfaist/techy"
keywords = ["latex", "parser", "flm", "markup"]
categories = ["parser-implementations", "text-processing"]

# Zero mandatory dependencies (ARCHITECTURE.md, Decision 5):
# hand-written Display/Error impls; library conditions flow through diagnostics, not logging.
[dependencies]

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[profile.release]
lto = true
codegen-units = 1
