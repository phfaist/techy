[workspace]
# A virtual workspace root has no `edition` to infer the resolver from, so pin it
# explicitly: v1 would unify features across the no_std-leaning core and std-linking
# members.
resolver = "2"
members = ["techy", "techy-derive"]

# Shared metadata inherited by member crates (`<field>.workspace = true`).
[workspace.package]
version = "0.1.0"
edition = "2021"
# Dyn trait upcasting to `dyn Any` (diagnostics condition payloads, DESIGN_RATIONALE.md
# [§dd-dr:errors]) stabilized in 1.86; core::error::Error, the previous pin, needed only 1.81.
rust-version = "1.86"
authors = ["Philippe Faist"]
license = "MIT"
repository = "https://github.com/phfaist/techy"

# Workspace-wide lint policy; members opt in with `[lints] workspace = true`.
# missing_docs is "deny" (promoted at API-review Phase 3 S10, with the count at
# zero): an undocumented public item fails the build. broken_intra_doc_links is
# "deny": documentation link rot fails the `cargo docs` build instead of silently
# shipping.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

# Profiles apply workspace-wide and are only honored in the workspace root manifest.
[profile.release]
lto = true
codegen-units = 1
