[workspace]
# A virtual workspace root has no `edition` to infer the resolver from, so pin it
# explicitly: v1 would unify features across the no_std-leaning core and std-linking
# members. v3 handles features as v2 does; it differs in one point: whenever cargo
# picks a dependency version (`cargo update`, a dependency added to a Cargo.toml, a
# Cargo.lock written anew), it takes the newest version that meets the Cargo.toml
# requirement and declares a minimum Rust version no higher than `rust-version` below;
# where no such version exists, the newest version that meets the requirement. A
# package that declares no minimum Rust version counts as compatible. Versions already
# in Cargo.lock are not changed. The committed Cargo.lock thus stays buildable on the
# minimum Rust version without pins in the manifests. The setting applies to this
# workspace only: a project that depends on techy picks its versions under its own
# settings.
resolver = "3"
members = ["techy", "techy-derive"]

# Shared metadata inherited by member crates (`<field>.workspace = true`).
[workspace.package]
version = "0.2.0"
edition = "2021"
# Dyn trait upcasting to `dyn Any` (diagnostics condition payloads, DESIGN_RATIONALE.md
# [§dd-dr:errors]) stabilized in 1.86; core::error::Error, the previous pin, needed only 1.81.
rust-version = "1.86"
authors = ["Philippe Faist"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/phfaist/techy"

# Workspace-wide lint policy; members opt in with `[lints] workspace = true`.
# missing_docs is "deny" (promoted at API-review Phase 3 S10, with the count at
# zero): an undocumented public item fails the build. broken_intra_doc_links is
# "deny": documentation link rot fails the `cargo docs` build instead of silently
# shipping.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

# Profiles apply workspace-wide and are only honored in the workspace root manifest.
[profile.release]
lto = true
codegen-units = 1
