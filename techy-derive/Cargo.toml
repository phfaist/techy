[package]
name = "techy-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Derive macros for techy: structured diagnostic conditions and serializable value types"
license.workspace = true
repository.workspace = true

# Build-time companion crate of `techy` (DESIGN_RATIONALE.md [§dd-dr:errors]): the derives are
# re-exported from `techy::error` and `techy::serialize`, next to the traits they implement.
# Publish this crate before `techy` (techy depends on it by version).

# docs.rs ignores `.cargo/config.toml`: inject the same sidebar customization that
# `cargo docs` uses locally (`rustdoc-header.html` links to the workspace
# `docs/rustdoc-header.html`).
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "rustdoc-header.html"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"
