# The everyday checks, run on each push to `main`, on each pull request, and by hand:
# the tests, clippy, the API documentation and the minimum supported Rust version, on
# Linux only. The other checks (the tests on macOS and Windows, the no_std build for
# wasm32, the API-stability comparison) are in the workflow `CI (full)` (ci-full.yml),
# which is run by hand.
#
# Every cargo command runs with `--locked`: the checks use the dependency versions of the
# committed Cargo.lock and fail if it is out of date with the manifests. The newest
# compatible versions are tried by `CI (full)`, which updates the lock file first.
#
# Deliberately absent:
#   * `cargo fmt --check`: the sources are hand-formatted and do not round-trip
#     through rustfmt, so a formatting gate would fail on the current tree.
#   * a release build: the release profile (lto, codegen-units = 1) is slow and is
#     a packaging concern, not a per-push one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug information: smaller build folders and caches, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The build cache is saved by the runs on a push to `main`, and read by all.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # `cargo test` runs the unit tests, the integration tests under
      # techy/tests/, and the doctests of both crates. Both feature settings run:
      # `serde` gates the rendering layer of techy::serialize and whole test files.
      - name: Test (default features)
        run: cargo test --workspace --locked
      - name: Test (all features)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --locked

  lints:
    name: clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (all features)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # `cargo docs` is the workspace alias (.cargo/config.toml): `doc --workspace
      # --no-deps` with docs/rustdoc-header.html injected. RUSTDOCFLAGS is left
      # unset on purpose — an env value replaces the config's rustdocflags and
      # would drop that injection. Broken intra-doc links and undocumented public
      # items already fail the build through the workspace lint policy in
      # Cargo.toml (`rustdoc::broken_intra_doc_links` and `missing_docs` are deny).
      - name: API documentation
        if: ${{ !cancelled() }}
        run: cargo docs --all-features --locked

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # `--all-targets`, so the test harness and the dev-dependencies are held to the
      # declared minimum too, not just the library a consumer compiles: a contributor
      # on the MSRV must be able to run the suite, and nothing else pins that. `check`
      # rather than `test` — the gate is that everything *builds* there; the behavior
      # of the tests is the stable job's business.
      - name: Check on the declared minimum toolchain
        run: cargo check --workspace --all-features --all-targets --locked
