[package]
name = "techy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A fast, extensible LaTeX parser for Rust"
readme = "../README.md"
license.workspace = true
repository.workspace = true
keywords = ["latex", "parser", "flm", "markup"]
categories = ["parser-implementations", "text-processing"]

[lints]
workspace = true

# Near-zero mandatory dependencies (DESIGN_RATIONALE.md [§dd-dr:dependencies]):
# hand-written Display/Error impls; library conditions flow through diagnostics, not
# logging. Exceptional, case-by-case additions of widely used, lightweight, no_std-capable
# crates are allowed — hashbrown (std's own HashMap implementation) backs the engine's
# derivation memo (no_std has no std::collections::HashMap).
# techy-derive is our own proc-macro companion (condition-declaration derives,
# DESIGN_RATIONALE.md [§dd-dr:errors]): build-time only — the runtime stays zero-dep.
[dependencies]
hashbrown = "0.15"
techy-derive = { version = "0.1.0", path = "../techy-derive" }
# serde is optional and rendering-only: the serialization capability (the value model
# and the capability traits of `techy::serialize`, and what is built on them) is
# unconditional plain Rust; enabling the `serde` feature only adds the serde impls that
# encode those values through a serde format. Default features off (no_std + alloc);
# `derive` for the payload/vocabulary derives.
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

# `serde` — the optional rendering layer over the always-present serialization
# capability (see the crate docs, "Cargo features"). Additive: enabling it adds no
# obligation to any implementer.
[features]
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1.0"
# Format crates for the tests of the `serde` rendering layer only (runtime deps stay
# serde-only): serde_json pins the canonical JSON rendering; postcard exercises the
# compact (non-human-readable) rendering.
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
